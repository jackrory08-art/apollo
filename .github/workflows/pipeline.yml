name: Racing Pipeline

on:
  schedule:
    - cron: '0 22 * * *'  # 8am AEST daily (22:00 UTC)
  workflow_dispatch:        # run manually from GitHub Actions tab anytime

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py
        env:
          DATA_SOURCE:        betfair
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
          BF_APP_KEY:         ${{ secrets.BF_APP_KEY }}
          BF_USERNAME:        ${{ secrets.BF_USERNAME }}
          BF_PASSWORD:        ${{ secrets.BF_PASSWORD }}
